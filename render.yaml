services:
  - type: web
    name: mold-maintenance-manager
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mold-maintenance-db
          property: connectionString

databases:
  - name: mold-maintenance-db
    databaseName: mold_maintenance
    user: mold_maintenance
